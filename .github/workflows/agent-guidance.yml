name: Agent guidance consistency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-guidance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-guidance:
    name: Routing, registry, links, and examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation validation requirements
        run: python -m pip install --quiet -r requirements-docs.txt

      - name: Validate AGENTS.md / CLAUDE.md routing and templates
        run: python .github/scripts/validate_agent_docs.py guidance

      - name: Validate entrypoint consistency and first-read routing
        run: python .github/scripts/validate_agent_docs.py first-read

      - name: Validate adapter registry and routed pages
        run: python .github/scripts/validate_agent_docs.py registry

      - name: Validate relative links and internal anchors
        run: python .github/scripts/validate_agent_docs.py links

      - name: Validate campaign state machine definition
        run: python .github/scripts/validate_agent_docs.py state-machine

      - name: Validate campaign record templates (strict template mode)
        run: python .github/scripts/validate_agent_docs.py examples

      - name: Validate campaign records and state edges (templates or filled copies)
        run: python .github/scripts/validate_agent_docs.py records

      - name: Validate first-contribution and safety surfaces
        run: python .github/scripts/validate_agent_docs.py controls

      - name: Validate deterministic fresh-agent evals (no agent/model launch)
        run: python .github/scripts/validate_agent_docs.py evals

      - name: Validate research opportunity map
        run: python .github/scripts/validate_agent_docs.py opportunities

      - name: Validate compatibility expectations and probe selfcheck
        run: python .github/scripts/validate_agent_docs.py compatibility

      - name: Run deterministic example checks (includes isolated offline first-contribution smoke)
        run: python .github/scripts/validate_agent_docs.py executables

      - name: Run validator self-tests on throwaway copies
        run: python .github/scripts/validate_agent_docs.py selftest

  supported-wheel:
    name: Pinned supported wheel import/signature drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the tested-supported version from expectations
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open("docs/agents/references/compatibility.json", encoding="utf-8"))
          print(f"OF_VERSION={data['supported']['openforage']['version']}")
          PY

      - name: Install the pinned supported wheel
        run: python -m pip install --quiet "openforage==${OF_VERSION}"

      - name: Probe documented callables and signatures (offline, no credentials)
        run: python .github/scripts/check_compatibility.py --check
